version: "3.8"

services:
  frontend:
    image: panditax727/frontend-devops2:latest
    container_name: frontend
    restart: always
    ports:
      - "80:5000"
    environment:
      PORT: 5000
      DEBUG: "False"
      BACKEND_URL: ${BACKEND_URL}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
